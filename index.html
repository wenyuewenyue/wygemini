<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WyFile · Gemini 文件分析</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">📄 WyFile <span>Gemini 文件分析</span></div>
  <div class="head-actions">
    <select id="model" title="模式">
      <option value="fast">⚡ 快速模式（Flash · 快）</option>
      <option value="expert">🎓 专家模式（Pro · 深）</option>
    </select>
    <button id="clearBtn" class="ghost">清空对话</button>
    <button id="passBtn" class="ghost">访问密码</button>
  </div>
</header>

<main id="chat"></main>

<div id="fileTray" class="file-tray hidden"></div>

<footer>
  <div class="composer">
    <button id="attachBtn" title="上传文件">📎</button>
    <input type="file" id="fileInput" multiple hidden
      accept=".pdf,.png,.jpg,.jpeg,.webp,.heic,.heif,.mp3,.wav,.aac,.ogg,.flac,.mp4,.mov,.webm,.mpeg,.txt,.md,.csv,.json,.docx,.xlsx,.pptx">
    <textarea id="input" rows="1" placeholder="问点什么，或上传文件让 Gemini 分析…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="sendBtn">发送</button>
  </div>
  <p class="hint">支持：PDF、图片、音频、视频（Gemini 原生分析）；TXT/MD/CSV/JSON 和 Word/Excel/PPT（浏览器提取文字后分析）。单个文件 ≤ 20MB，附件会保留到你手动移除，方便连续追问。</p>
</footer>

<div id="passModal" class="modal hidden">
  <div class="modal-box">
    <h3>输入访问密码</h3>
    <p>本站设置了访问密码，输一次即可，本机记住。</p>
    <input type="password" id="passInput" placeholder="访问密码">
    <button id="passSave">保存</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
